<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cybertec8 | Internal Security Systems</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 75% 15%,
                    rgba(34,211,238,.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 20% 85%,
                    rgba(59,130,246,.07),
                    transparent 32%
                ),
                #070b14;

            color: #e6edf7;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        .nav {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #1c2a3d;
            background: rgba(7,11,20,.82);
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #22d3ee,
                    #2563eb
                );

            font-size: 11px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: .6px;
        }

        .brand-name span {
            color: #22d3ee;
        }

        .portal {
            color: #64748b;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .hero {
            width: min(1080px, 90%);
            margin: auto;

            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 760px;
        }

        .eyebrow {
            color: #22d3ee;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 2px;
            text-transform: uppercase;

            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 72px);
            line-height: 1.02;
            letter-spacing: -2.5px;
            font-weight: 800;
        }

        h1 span {
            color: #22d3ee;
        }

        .description {
            max-width: 650px;

            margin-top: 22px;

            color: #8291a5;

            font-size: 14px;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            gap: 11px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 18px;

            border-radius: 7px;

            font-size: 11px;
            font-weight: 750;

            text-decoration: none;
        }

        .primary {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #0891b2,
                    #2563eb
                );
        }

        .secondary {
            color: #a9b7c8;

            border: 1px solid #24344a;
            background: #0c1421;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 45px;

            color: #6f8095;
            font-size: 10px;
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 9px rgba(34,197,94,.55);
        }

        @media(max-width:600px) {

            .portal {
                display: none;
            }

            .hero {
                width: 88%;
            }

            .buttons {
                flex-direction: column;
                width: 180px;
            }

        }

    </style>

</head>


<body>


    <nav class="nav">

        <div class="brand">

            <div class="logo">
                CT8
            </div>

            <div class="brand-name">
                CYBER<span>TEC8</span>
            </div>

        </div>


        <div class="portal">
            Internal Security Systems
        </div>

    </nav>


    <main class="hero">

        <div class="hero-content">

            <div class="eyebrow">
                Cybertec8 Security Platform
            </div>

            <h1>
                Internal Security
                <span>Systems.</span>
            </h1>

            <p class="description">

                Secure access to Cybertec8 internal security
                resources, application reviews and operational
                security documentation.

            </p>


            <div class="buttons">

                <a
                    href="/login"
                    class="btn primary"
                >
                    Employee Login →
                </a>

                <a
                    href="/login"
                    class="btn secondary"
                >
                    Security Portal
                </a>

            </div>


            <div class="status">

                <span class="dot"></span>

                All internal systems operational

            </div>

        </div>

    </main>


</body>

</html>
